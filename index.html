<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products Information</title>
<style>
  :root{
    --kraft: #e8ddc8;
    --kraft-dark: #d8c9a8;
    --ink: #3a2e1f;
    --rust: #a5540f;
    --rust-dark: #7c3d09;
    --line: #b8a888;
    --paper: #f6f0e2;
    --stamp-red: #a5342b;
    --ok-green: #3f6b3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: repeating-linear-gradient(135deg, var(--kraft) 0px, var(--kraft) 2px, var(--kraft-dark) 2px, var(--kraft-dark) 3px);
    font-family: 'Courier New', Courier, monospace;
    color: var(--ink);
    padding: 30px 16px;
    min-height:100vh;
  }
  .sheet{
    max-width: 900px;
    margin: 0 auto;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 8px 8px 0 rgba(58,46,31,0.25);
    position: relative;
  }
  .sheet::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px dashed var(--line);
    pointer-events:none;
  }
  .titlebar{
    background: var(--ink);
    color: var(--paper);
    padding: 8px 18px;
    font-size: 12px;
    letter-spacing: 2px;
    display:flex; justify-content:space-between;
  }
  header{
    padding: 28px 40px 10px;
    text-align:center;
    border-bottom: 3px double var(--rust-dark);
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--rust-dark);
    font-size: 30px;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .subtitle{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--ink);
    opacity:.65;
    margin-bottom: 14px;
  }
  .stamp{
    position:absolute;
    top: 22px; right: 34px;
    border: 3px solid var(--stamp-red);
    color: var(--stamp-red);
    font-family: Georgia, serif;
    font-weight:700;
    font-size: 12px;
    padding: 4px 10px;
    letter-spacing:2px;
    transform: rotate(8deg);
    opacity: 0;
    transition: opacity .15s;
    border-radius: 4px;
    pointer-events:none;
  }
  .stamp.show{opacity:.85;}
 
  .body-grid{
    display:grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 30px 40px;
    padding: 26px 40px 10px;
  }
  .field{
    margin-bottom: 18px;
  }
  label{
    display:block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--rust-dark);
    font-weight:700;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  input, select{
    width:100%;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    padding: 7px 8px;
    background: #fffdf6;
    border: 1px solid var(--ink);
    color: var(--ink);
    outline:none;
  }
  input:focus, select:focus{
    border-color: var(--rust);
    box-shadow: 0 0 0 2px rgba(165,84,15,0.2);
  }
 
  .record-indicator{
    padding: 4px 40px 0;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--ink);
    opacity: .7;
    text-align:right;
  }
 
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap: 10px;
    padding: 22px 40px 32px;
    border-top: 3px double var(--rust-dark);
    margin-top: 14px;
  }
  button{
    font-family: 'Courier New', Courier, monospace;
    font-weight:700;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 16px;
    background: var(--paper);
    border: 1px solid var(--ink);
    color: var(--ink);
    cursor:pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  button:hover{
    transform: translate(-1px,-1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  button:active{
    transform: translate(2px,2px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  button.primary{
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust-dark);
    box-shadow: 3px 3px 0 var(--rust-dark);
  }
  button.danger{
    background: var(--stamp-red);
    color: var(--paper);
    border-color: #6d211b;
    box-shadow: 3px 3px 0 #6d211b;
  }
  button.spacer{
    margin-left:auto;
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow: 3px 3px 0 var(--ink);
    transform:none;
  }
 
  .toast{
    position:fixed;
    bottom: 22px; left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    font-size: 12px;
    letter-spacing:1px;
    border-radius: 3px;
    opacity:0;
    transition: opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
 
  .page{ display:none; }
  .page.active{ display:block; }
 
  .view-toggle{
    display:flex;
    justify-content:center;
    gap: 10px;
    padding: 14px 40px 0;
  }
  .view-toggle button{
    box-shadow: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 11px;
    background: transparent;
  }
  .view-toggle button.active{
    background: var(--rust);
    color: var(--paper);
    border-color: var(--rust-dark);
  }
 
  .list-section{
    border-top: 3px double var(--rust-dark);
    padding: 20px 40px 34px;
  }
  .list-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .list-header h2{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rust-dark);
    margin: 0;
  }
  .list-count{
    font-size: 11px;
    opacity:.65;
    letter-spacing: 1px;
  }
  .table-wrap{
    border: 1px solid var(--ink);
    background: #fffdf6;
    max-height: 260px;
    overflow-y: auto;
  }
  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  thead th{
    position: sticky;
    top: 0;
    background: var(--ink);
    color: var(--paper);
    text-align: left;
    padding: 8px 10px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    font-size: 10.5px;
    white-space: nowrap;
  }
  tbody td{
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  tbody tr{
    cursor: pointer;
  }
  tbody tr:hover{
    background: rgba(165,84,15,0.08);
  }
  tbody tr.active{
    background: rgba(165,84,15,0.18);
  }
  tbody tr.active td:first-child{
    border-left: 3px solid var(--rust);
  }
  tbody tr.just-saved{
    animation: rowFlash 1.1s ease-out;
  }
  @keyframes rowFlash{
    0%   { background: rgba(63,107,58,0.35); }
    100% { background: transparent; }
  }
  .empty-row td{
    text-align:center;
    padding: 18px;
    opacity: .55;
    font-style: italic;
    cursor: default;
  }
  .empty-row:hover{background:none;}
 
  @media print{
    body{background:#fff; padding:0;}
    .titlebar, .actions, .record-indicator, .list-section{display:none;}
    .sheet{box-shadow:none; border:none;}
    .sheet::before{display:none;}
    input, select{border:1px solid #333;}
  }
 
  @media (max-width: 640px){
    .body-grid{grid-template-columns: 1fr; padding: 20px;}
    header, .actions{padding-left:20px; padding-right:20px;}
    .list-section{padding-left:20px; padding-right:20px;}
    .stamp{display:none;}
    .table-wrap{overflow-x:auto;}
  }
</style>
</head>
<body>
 
<div class="sheet">
  <div class="titlebar">
    <span>■ INVENTORY LEDGER</span>
    <span>FORM 04-A</span>
  </div>
 
  <div class="stamp" id="stamp">SAVED</div>
 
  <header>
    <h1>Products Information</h1>
    <div class="subtitle">— catalog &amp; stock record —</div>
  </header>
 
  <div class="view-toggle">
    <button id="tabForm" class="active">📝 Entry Form</button>
    <button id="tabList">📋 View Saved Records</button>
  </div>
 
  <div class="page active" id="pageForm">
  <div class="record-indicator" id="recordIndicator">No records yet</div>
 
  <div class="body-grid">
    <div class="field">
      <label for="productId">Product ID</label>
      <input id="productId" type="text" placeholder="e.g. P-0001">
    </div>
    <div class="field">
      <label for="productNumber">Product Number</label>
      <input id="productNumber" type="text" placeholder="e.g. SKU-4471">
    </div>
 
    <div class="field">
      <label for="manufacturer">Manufacturer</label>
      <input id="manufacturer" type="text">
    </div>
    <div class="field">
      <label for="supplier">Product Supplier</label>
      <input id="supplier" type="text">
    </div>
 
    <div class="field">
      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" min="0" step="1">
    </div>
    <div class="field">
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="">— select —</option>
        <option>Grade A</option>
        <option>Grade B</option>
        <option>Grade C</option>
        <option>Damaged</option>
      </select>
    </div>
 
    <div class="field">
      <label for="price">Price</label>
      <input id="price" type="number" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="field">
      <label for="expireDate">Expire Date</label>
      <input id="expireDate" type="date">
    </div>
  </div>
 
  <div class="actions">
    <button class="primary" id="btnSave">💾 Save Record</button>
    <button id="btnNew">＋ New</button>
    <button class="danger" id="btnDelete">🗑 Delete Record</button>
    <button id="btnPrint">🖨 Print Record</button>
    <button class="spacer" id="btnFirst">⏮ First</button>
    <button id="btnPrev">◀ Previous</button>
    <button id="btnNext">Next ▶</button>
    <button id="btnLast">Last ⏭</button>
  </div>
  </div>
 
  <div class="page" id="pageList">
  <div class="list-section">
    <div class="list-header">
      <h2>Saved Records</h2>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="list-count" id="listCount">0 records</span>
        <button id="btnExport" style="padding:5px 10px; font-size:10.5px;">⬇ Export</button>
        <button id="btnImport" style="padding:5px 10px; font-size:10.5px;">⬆ Import</button>
        <input type="file" id="fileImport" accept=".json" style="display:none;">
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product ID</th>
            <th>Product #</th>
            <th>Manufacturer</th>
            <th>Supplier</th>
            <th>Qty</th>
            <th>Quality</th>
            <th>Price</th>
            <th>Expire Date</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="8">No records saved yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script>
  // Records are saved to persistent storage — they survive page refresh.
  let records = [];
  let currentIndex = -1; // -1 means "new / blank" state
  const STORAGE_KEY = 'products-records';
 
  const fields = ['productId','productNumber','manufacturer','supplier','quantity','quality','price','expireDate'];
  const els = {};
  fields.forEach(f => els[f] = document.getElementById(f));
 
  const recordIndicator = document.getElementById('recordIndicator');
  const stamp = document.getElementById('stamp');
  const toast = document.getElementById('toast');
 
  async function persistRecords(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(records), false);
    } catch(err){
      console.error('Storage save failed:', err);
      showToast('⚠ Could not save — storage error');
    }
  }
 
  async function loadRecordsFromStorage(){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      records = result && result.value ? JSON.parse(result.value) : [];
    } catch(err){
      records = []; // key doesn't exist yet — first time using the form
    }
  }
 
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }
 
  function flashStamp(text){
    stamp.textContent = text;
    stamp.classList.add('show');
    setTimeout(() => stamp.classList.remove('show'), 1100);
  }
 
  function clearForm(){
    fields.forEach(f => els[f].value = '');
  }
 
  function loadRecordToForm(i){
    const r = records[i];
    fields.forEach(f => els[f].value = r[f] ?? '');
  }
 
  function readFormToRecord(){
    const r = {};
    fields.forEach(f => r[f] = els[f].value);
    return r;
  }
 
  function updateIndicator(){
    if(records.length === 0){
      recordIndicator.textContent = 'No records yet';
    } else if (currentIndex === -1){
      recordIndicator.textContent = `New record — ${records.length} saved`;
    } else {
      recordIndicator.textContent = `Record ${currentIndex + 1} of ${records.length}`;
    }
  }
 
  const tableBody = document.getElementById('tableBody');
  const listCount = document.getElementById('listCount');
 
  function renderTable(justSavedIndex){
    listCount.textContent = records.length === 1 ? '1 record' : `${records.length} records`;
 
    if(records.length === 0){
      tableBody.innerHTML = '<tr class="empty-row"><td colspan="8">No records saved yet</td></tr>';
      return;
    }
 
    tableBody.innerHTML = '';
    records.forEach((r, i) => {
      const tr = document.createElement('tr');
      if(i === currentIndex) tr.classList.add('active');
      if(i === justSavedIndex) tr.classList.add('just-saved');
      tr.innerHTML = `
        <td>${escapeHtml(r.productId)}</td>
        <td>${escapeHtml(r.productNumber)}</td>
        <td>${escapeHtml(r.manufacturer)}</td>
        <td>${escapeHtml(r.supplier)}</td>
        <td>${escapeHtml(r.quantity)}</td>
        <td>${escapeHtml(r.quality)}</td>
        <td>${escapeHtml(r.price)}</td>
        <td>${escapeHtml(r.expireDate)}</td>
      `;
      tr.addEventListener('click', () => goTo(i));
      tableBody.appendChild(tr);
      if(i === justSavedIndex){
        tr.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }
 
  function escapeHtml(v){
    if(v === undefined || v === null || v === '') return '—';
    return String(v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
 
  function goTo(i){
    if(records.length === 0) return;
    currentIndex = Math.max(0, Math.min(i, records.length - 1));
    loadRecordToForm(currentIndex);
    updateIndicator();
    renderTable();
  }
 
  document.getElementById('btnSave').addEventListener('click', async () => {
    const rec = readFormToRecord();
    const hasData = fields.some(f => rec[f] && rec[f].toString().trim() !== '');
    if(!hasData){
      showToast('Nothing to save — fill in a field first');
      return;
    }
    const wasNew = currentIndex === -1;
    if(wasNew){
      records.push(rec);
      currentIndex = records.length - 1;
    } else {
      records[currentIndex] = rec;
    }
    const savedIndex = currentIndex;
 
    await persistRecords();
    updateIndicator();
    renderTable(savedIndex);
    flashStamp('SAVED');
 
    if(wasNew){
      // Ready the form for the next entry so it doesn't get overwritten
      currentIndex = -1;
      clearForm();
      updateIndicator();
      showToast('Record saved — check the table below');
      els.productId.focus();
    } else {
      showToast('Record updated');
    }
  });
 
  document.getElementById('btnNew').addEventListener('click', () => {
    currentIndex = -1;
    clearForm();
    updateIndicator();
    renderTable();
    els.productId.focus();
  });
 
  document.getElementById('btnDelete').addEventListener('click', async () => {
    if(currentIndex === -1 || records.length === 0){
      showToast('No saved record to delete');
      return;
    }
    records.splice(currentIndex, 1);
    if(records.length === 0){
      currentIndex = -1;
      clearForm();
    } else {
      currentIndex = Math.min(currentIndex, records.length - 1);
      loadRecordToForm(currentIndex);
    }
    await persistRecords();
    updateIndicator();
    renderTable();
    flashStamp('DELETED');
    showToast('Record deleted');
  });
 
  document.getElementById('btnPrint').addEventListener('click', () => {
    window.print();
  });
 
  document.getElementById('btnFirst').addEventListener('click', () => goTo(0));
  document.getElementById('btnLast').addEventListener('click', () => goTo(records.length - 1));
  document.getElementById('btnPrev').addEventListener('click', () => {
    if(currentIndex === -1) return goTo(records.length - 1);
    goTo(currentIndex - 1);
  });
  document.getElementById('btnNext').addEventListener('click', () => {
    if(currentIndex === -1) return;
    goTo(currentIndex + 1);
  });
 
  document.getElementById('btnExport').addEventListener('click', () => {
    if(records.length === 0){
      showToast('No records to export yet');
      return;
    }
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp2 = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `products-${stamp2}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exported to file — save it somewhere safe');
  });
 
  const fileImport = document.getElementById('fileImport');
  document.getElementById('btnImport').addEventListener('click', () => fileImport.click());
 
  fileImport.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try{
        const imported = JSON.parse(evt.target.result);
        if(!Array.isArray(imported)) throw new Error('Not a records array');
        records = imported.map(r => {
          const clean = {};
          fields.forEach(f => clean[f] = r[f] ?? '');
          return clean;
        });
        currentIndex = records.length > 0 ? 0 : -1;
        if(currentIndex >= 0) loadRecordToForm(0); else clearForm();
        await persistRecords();
        updateIndicator();
        renderTable();
        showToast(`Imported ${records.length} record(s)`);
      } catch(err){
        showToast('Could not read that file — is it a valid export?');
      }
      fileImport.value = '';
    };
    reader.readAsText(file);
  });
 
  const tabForm = document.getElementById('tabForm');
  const tabList = document.getElementById('tabList');
  const pageForm = document.getElementById('pageForm');
  const pageList = document.getElementById('pageList');
 
  function showPage(which){
    const formActive = which === 'form';
    pageForm.classList.toggle('active', formActive);
    pageList.classList.toggle('active', !formActive);
    tabForm.classList.toggle('active', formActive);
    tabList.classList.toggle('active', !formActive);
  }
  tabForm.addEventListener('click', () => showPage('form'));
  tabList.addEventListener('click', () => showPage('list'));
 
  async function init(){
    recordIndicator.textContent = 'Loading saved records…';
    await loadRecordsFromStorage();
    currentIndex = -1;
    clearForm();
    updateIndicator();
    renderTable();
  }
 
  init();
</script>
 
</body>
</html>
